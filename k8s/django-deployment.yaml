apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: django

  template:
    metadata:
      labels:
        app: django

    spec:
      containers:
      - name: django

        image: amralerohan41/notes-app:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        envFrom:
        - configMapRef:
            name: django-config

        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: DB_PASSWORD

        command:
        - sh
        - -c
        - |
          python manage.py migrate --noinput &&
          gunicorn notesapp.wsgi:application --bind 0.0.0.0:8000